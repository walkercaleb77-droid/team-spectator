name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish instead of cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Real roster (student data) is published only when the USE_REAL_ROSTER
      # repo variable is "true". It comes from the PRIVATE team-spectator-data
      # repo via a read-only deploy key. Otherwise the sample roster is used.
      - name: Fetch real roster
        if: vars.USE_REAL_ROSTER == 'true'
        uses: actions/checkout@v7
        with:
          repository: walkercaleb77-droid/team-spectator-data
          ssh-key: ${{ secrets.ROSTER_DEPLOY_KEY }}
          path: .roster
          persist-credentials: false
      - run: npm run build
        env:
          ROSTER_DIR: ${{ vars.USE_REAL_ROSTER == 'true' && '.roster' || '' }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
